[project]
name = "n8n-transcriper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "pydantic>=2.0",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[project.scripts]
n8n-to-python = "n8n_to_python.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/n8n_to_python"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
