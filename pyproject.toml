[project]
name = "n8n-transcriper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "aiosmtplib>=5.1.3",
    "asyncpg>=0.32.0",
    "pydantic>=2.0",
    "pypdf>=6.21.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.17.2",
]

[project.scripts]
n8n-to-python = "n8n_to_python.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/n8n_to_python"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
